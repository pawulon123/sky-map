<div class="p-4 grid gap-4 md:grid-cols-[320px_1fr]">
  <!-- Panel -->
  <div class="space-y-4">

    <!-- Rzut i wymiary -->
    <section class="border rounded-xl p-3">
      <h2 class="font-semibold text-lg mb-2">Rzut i wymiary</h2>

      <div class="grid grid-cols-3 gap-2 mb-3">
        <button class="btn" (click)="setProjection('stereographic')">Stereograficzny</button>
        <button class="btn" (click)="setProjection('azimuthal')">Azymutalny (Equidistant)</button>
        <button class="btn" (click)="setProjection('azimuthalEA')">Azymutalny (Equal-Area)</button>
        <button class="btn" (click)="setProjection('orthographic')">Ortograficzny</button>
        <button class="btn" (click)="setProjection('gnomonic')">Gnomoniczny</button>
        <button class="btn" (click)="setProjection('mercator')">Mercatora</button>
        <button class="btn" (click)="setProjection('equirect')">Równikowy</button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <label class="flex items-center gap-2">
          Szerokość
          <input
            type="number"
            class="input"
            [value]="width()"
            (input)="setSize(($any($event.target).valueAsNumber)||1200, height())"
          />
        </label>

        <label class="flex items-center gap-2">
          Wysokość
          <input
            type="number"
            class="input"
            [value]="height()"
            (input)="setSize(width(), ($any($event.target).valueAsNumber)||1200)"
          />
        </label>
      </div>
    </section>

    <!-- Warstwy -->
    <section class="border rounded-xl p-3">
      <h2 class="font-semibold text-lg mb-2">Warstwy</h2>

      <!-- Master checkbox -->
      <label class="flex items-center gap-2 mb-2 font-medium">
        <input
          type="checkbox"
          [checked]="allLayersOn()"
          (change)="toggleAllLayers($any($event.target).checked)"
        />
        Wszystkie warstwy
      </label>

      <hr class="my-2" />

      <!-- Pojedyncze warstwy -->
      <div class="space-y-1 text-sm">
        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            [checked]="showStars"
            (change)="showStars = $any($event.target).checked"
          />
          Gwiazdy
        </label>

        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            [checked]="showBoundaries"
            (change)="showBoundaries = $any($event.target).checked"
          />
          Granice konstelacji
        </label>

        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            [checked]="showGrid"
            (change)="showGrid = $any($event.target).checked"
          />
          Siatka RA / Dec
        </label>

        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            [checked]="showAsterisms"
            (change)="showAsterisms = $any($event.target).checked"
          />
          Asterizmy
        </label>

        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            [checked]="showConstellationLines"
            (change)="showConstellationLines = $any($event.target).checked"
          />
          Linie konstelacji
        </label>

        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            [checked]="showLabels"
            (change)="showLabels = $any($event.target).checked"
          />
          Etykiety / nazwy
        </label>
      </div>
    </section>
  </div>

  <!-- SVG preview -->
  <div class="border rounded-xl overflow-auto p-2">
    <app-root-svg
      [width]="width()"
      [height]="height()"
      [showStars]="showStars"
      [showBoundaries]="showBoundaries"
      [showGrid]="showGrid"
      [showAsterisms]="showAsterisms"
      [showConstellationLines]="showConstellationLines"
      [showLabels]="showLabels"
      [maxIntensity]="maxMag"
    >
    </app-root-svg>
  </div>
</div>
