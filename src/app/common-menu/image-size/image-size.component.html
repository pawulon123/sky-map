<div>
  <button (click)="fitToWindow('fit')">Dopasuj do okna</button>
  <button [ngClass]="{ active: moveActive }" (click)="move('move')">przesuwaj</button>

  <button [ngClass]="{ active: zoomMode === 'in' }" (click)="toggleZoom('in')">Zoom +</button>

  <button [ngClass]="{ active: zoomMode === 'out' }" (click)="toggleZoom('out')">Zoom -</button>
</div>
