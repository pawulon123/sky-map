<div>
  <button (click)="fitToWindow('fit')">Dopasuj do okna</button>
  <button (click)="resetToRealSize('resetToRealSize')">Rzeczywisty rozmiar</button>

  <button (click)="toggleZoom('out')" appActiveMenuButton="toggleZoom" [zoomMode]="'out'">Zoom -</button>
</div>
