<div class="constellation-line-controls" *ngIf="constellationLineSettings$ | async as settings">
  <app-header-portal key="constellationLines">
    <mat-checkbox color="primary" [checked]="settings.visible" (change)="update('visible', $event.checked)">
    </mat-checkbox>
  </app-header-portal>

  <app-line-controll [settings]="settings" (updateLine)="updateLine($event)"></app-line-controll>

  <div class="head-in-menu section-in-menu-top">
    Odstęp przy gwiazdach: {{ settings.nodeGap }}

    <div>
      <mat-slider min="0" max="20" step="0.5">
        <input matSliderThumb [value]="settings.nodeGap" (input)="update('nodeGap', +$any($event.target).value)" />
      </mat-slider>
    </div>
  </div>
</div>
