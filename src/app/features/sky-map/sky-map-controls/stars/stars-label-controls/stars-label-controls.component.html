<div class="stars-label-controls space-y-4" *ngIf="starsSettings$ | async as starsSettings">
  <!-- NAGŁÓWEK -->
  <div class="font-semibold mb-2">Etykiety gwiazd</div>

  <app-font-label [settingsLabels]="starsSettings.labels" (updateFont)="updateFont($event)"></app-font-label>

  <app-colision-label (updateColision)="updateColision($event)"></app-colision-label>

  <!-- WIDOCZNOŚĆ ETYKIET -->
  <mat-slide-toggle [checked]="starsSettings.labels.visible" (change)="update('visible', $event.checked)">
    Widoczne
  </mat-slide-toggle>

  <!-- POKAZUJ BAYER -->
  <mat-slide-toggle [checked]="starsSettings.labels.showBayer" (change)="update('showBayer', $event.checked)">
    Pokaż Bayer
  </mat-slide-toggle>

  <!-- MAGNITUDO OD–DO -->
  <div>
    <div class="text-sm mb-1">Magnitudo od–do</div>
    <div class="flex gap-2 items-center">
      <mat-form-field appearance="outline" class="w-24">
        <mat-label>Od</mat-label>
        <input
          matInput
          type="number"
          min="-5"
          max="20"
          [ngModel]="starsSettings.labels.magnitudeRange[0]"
          (ngModelChange)="updateMagnitudeRange(0, $event, starsSettings.labels.magnitudeRange)"
        />
      </mat-form-field>

      <span>–</span>

      <mat-form-field appearance="outline" class="w-24">
        <mat-label>Do</mat-label>
        <input
          matInput
          type="number"
          min="-5"
          max="20"
          [ngModel]="starsSettings.labels.magnitudeRange[1]"
          (ngModelChange)="updateMagnitudeRange(1, $event, starsSettings.labels.magnitudeRange)"
        />
      </mat-form-field>
    </div>
  </div>
</div>
