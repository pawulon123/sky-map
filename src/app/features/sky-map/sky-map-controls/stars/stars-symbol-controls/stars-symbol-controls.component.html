<div class="stars-symbol-controls space-y-2">
  <div class="flex items-center justify-between">
    <label class="font-semibold">Symbole gwiazd</label>

    <label class="flex items-center gap-2 text-sm">
      <span>Widoczne</span>
      <input
        type="checkbox"
        [ngModel]="(starsSettings$ | async)?.symbols?.visible"
        (ngModelChange)="toggleVisible($event)"
      />
    </label>
  </div>

  <!-- SUWAK RING -->
  <ng-container *ngIf="starsSettings$ | async as settings">
    <div class="flex items-center justify-between">
      <label class="text-sm">Pierścień</label>

      <div class="flex items-center gap-2">
        <input
          type="range"
          min="0"
          max="15"
          step="0.1"
          [ngModel]="settings.symbols.ring"
          (ngModelChange)="updateRing($event)"
        />

        <!-- liczbowy podgląd wartości -->
        <span class="text-sm w-10 text-right">
          {{ settings.symbols.ring }}
        </span>
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf="starsSettings$ | async as settings">
    <div class="flex items-center justify-between">
      <label class="text-sm">Widoczność (magnitudo max)</label>

      <div class="flex items-center gap-2">
        <input
          type="range"
          min="-1"
          max="15"
          step="0.1"
          [ngModel]="settings.symbols.magMax"
          (ngModelChange)="updateMagMax($event)"
        />

        <!-- podgląd aktualnej wartości -->
        <span class="text-sm w-10 text-right">
          {{ settings.symbols.magMax }}
        </span>
      </div>
    </div>
  </ng-container>
</div>
