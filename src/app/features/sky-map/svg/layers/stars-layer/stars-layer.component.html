<svg:g id="layer-stars">
  <!-- widoczność warstwy -->
  <ng-container *ngIf="starsSettings.symbols.visible">
    <!-- prekomputowane gwiazdy -->
    <ng-container *ngFor="let rs of starSynbols(); trackBy: trackByStar">
      <g
        *ngIf="showStars"
        [attr.transform]="'translate(' + rs.cx + ',' + rs.cy + ')'"
        [attr.data-tooltip]="getTooltip(rs)"
      >
        <ng-container [ngSwitch]="rs.shape">
          <!-- 1. Kółko -->
          <circle
            *ngSwitchCase="'circle'"
            [attr.r]="rs.r"
            [attr.fill]="rs.fillColor"
            [attr.fill-opacity]="rs.fillOpacity"
            [attr.stroke]="rs.strokeColor"
            [attr.stroke-opacity]="rs.strokeOpacity"
            [attr.stroke-width]="rs.baseStrokeWidth"
          />

          <!-- 2. Pierścień -->
          <circle
            *ngSwitchCase="'ring'"
            [attr.r]="rs.r"
            fill="none"
            [attr.stroke]="rs.strokeColor"
            [attr.stroke-opacity]="rs.strokeOpacity"
            [attr.stroke-width]="rs.ringStrokeWidth"
          />

          <!-- 3. Gwiazda 5-ramienna -->
          <polygon
            *ngSwitchCase="'star'"
            [attr.points]="rs.polygonPoints"
            [attr.fill]="rs.hasFill ? rs.fillColor : 'none'"
            [attr.fill-opacity]="rs.fillOpacity"
            [attr.stroke]="rs.strokeColor"
            [attr.stroke-opacity]="rs.strokeOpacity"
            [attr.stroke-width]="rs.baseStrokeWidth"
            stroke-linejoin="round"
          ></polygon>

          <!-- 4. Krzyżyk -->
          <g *ngSwitchCase="'cross'">
            <line
              [attr.x1]="-rs.r"
              y1="0"
              [attr.x2]="rs.r"
              y2="0"
              fill="none"
              [attr.stroke]="rs.strokeColor"
              [attr.stroke-opacity]="rs.strokeOpacity"
              [attr.stroke-width]="rs.crossStrokeWidth"
              stroke-linecap="round"
            ></line>
            <line
              x1="0"
              [attr.y1]="-rs.r"
              x2="0"
              [attr.y2]="rs.r"
              fill="none"
              [attr.stroke]="rs.strokeColor"
              [attr.stroke-opacity]="rs.strokeOpacity"
              [attr.stroke-width]="rs.crossStrokeWidth"
              stroke-linecap="round"
            ></line>
          </g>

          <!-- 5. Kwadrat -->
          <polygon
            *ngSwitchCase="'square'"
            [attr.points]="rs.polygonPoints"
            [attr.fill]="rs.hasFill ? rs.fillColor : 'none'"
            [attr.fill-opacity]="rs.fillOpacity"
            [attr.stroke]="rs.strokeColor"
            [attr.stroke-opacity]="rs.strokeOpacity"
            [attr.stroke-width]="rs.baseStrokeWidth"
          ></polygon>

          <!-- 6. Trójkąt -->
          <polygon
            *ngSwitchCase="'triangle'"
            [attr.points]="rs.polygonPoints"
            [attr.fill]="rs.hasFill ? rs.fillColor : 'none'"
            [attr.fill-opacity]="rs.fillOpacity"
            [attr.stroke]="rs.strokeColor"
            [attr.stroke-opacity]="rs.strokeOpacity"
            [attr.stroke-width]="rs.baseStrokeWidth"
          ></polygon>

          <!-- 7. Custom SVG (path) -->
          <path
            *ngSwitchCase="'custom'"
            [attr.d]="starsSettings.symbols.customSvgPath"
            [attr.transform]="rs.customTransform"
            [attr.fill]="rs.hasFill ? rs.fillColor : 'none'"
            [attr.fill-opacity]="rs.fillOpacity"
            [attr.stroke]="rs.strokeColor"
            [attr.stroke-opacity]="rs.strokeOpacity"
            [attr.stroke-width]="rs.baseStrokeWidth"
          ></path>

          <!-- fallback: kółko -->
          <circle
            *ngSwitchDefault
            [attr.r]="rs.r"
            [attr.fill]="rs.fillColor"
            [attr.fill-opacity]="rs.fillOpacity"
            [attr.stroke]="rs.strokeColor"
            [attr.stroke-opacity]="rs.strokeOpacity"
            [attr.stroke-width]="rs.baseStrokeWidth"
          />
        </ng-container>
      </g>
    </ng-container>
  </ng-container>

  <!-- etykiety -->
  <g app-labels-layer *ngIf="showLabels()"></g>
</svg:g>
