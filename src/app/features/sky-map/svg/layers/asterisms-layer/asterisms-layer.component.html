<svg:g id="layer-asterisms">
  <ng-container *ngIf="asterismSettings$ | async as settings">
    <ng-container *ngIf="settings.visible">
      <ng-container *ngFor="let d of paths()">
        <path [attr.d]="d" stroke="#d00" stroke-width="0.6" fill="none"></path>
      </ng-container>
    </ng-container>
  </ng-container>
</svg:g>
