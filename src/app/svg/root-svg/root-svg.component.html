<!-- src/app/svg/root-svg/root-svg.component.html -->
<svg [attr.width]="width" [attr.height]="height" [attr.viewBox]="'0 0 ' + width + ' ' + height">

  <path [attr.d]="spherePath()" fill="none" stroke="#222" [attr.stroke-width]="0.6"></path>

  <g *ngIf="showGrid">
    <path [attr.d]="graticulePath()" fill="none" stroke="#bbb" [attr.stroke-width]="0.4"></path>
  </g>

  <!-- GWIAZDY: hostem komponentu jest <g> -->
  <g app-stars-layer *ngIf="showStars"
     [showLabels]="showLabels"
     [maxMag]="maxIntensity">
  </g>

 
       <g app-constellation-lines-layer *ngIf="showConstellationLines"></g>
       
       <g app-boundaries-layer *ngIf="showBoundaries"></g>
       <g app-asterisms-layer *ngIf="showAsterisms"></g>
  
</svg>
