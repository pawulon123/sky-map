<svg:g id="layer-stars" *ngIf="show()">

  <!-- punkty gwiazd -->
  <ng-container *ngFor="let s of stars()">
    <circle
      class="star-point"
      [attr.cx]="starCx(s)"
      [attr.cy]="starCy(s)"
      [attr.r]="radius(s)"
    />
  </ng-container>

  <!-- warstwa etykiet gwiazd jako osobny komponent -->
<g
  app-star-labels-layer
  *ngIf="showLabels()"
  [stars]="stars()"
  [labelMaxMag]="labelMaxMag()"
  [radiusFn]="radius.bind(this)"
></g>


</svg:g>
