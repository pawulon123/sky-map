<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SkyMap</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon z folderu public/ -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- ✅ CSP na czas developmentu (bez bloków HMR i favicon) -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          img-src 'self' data: blob:;
          style-src 'self' 'unsafe-inline';
          script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';
          font-src 'self' data:;
          connect-src 'self' ws://localhost:4200 wss://localhost:4200 https://cdn.jsdelivr.net https://raw.githubusercontent.com;
        ">
</head>

<body>
  <app-root></app-root>
</body>
</html>
